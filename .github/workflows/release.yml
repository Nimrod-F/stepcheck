name: Release

# Cut a release by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
# This builds a self-contained binary per platform, attaches them to the GitHub
# release, and (when the corresponding token secret is present) publishes the
# crate to crates.io and the wrapper package to npm.
#
# Required repository secrets for the publish jobs (both optional; the jobs skip
# themselves when the secret is empty):
#   CARGO_REGISTRY_TOKEN  -- a crates.io API token (for `cargo publish`)
#   NPM_TOKEN             -- an npm automation token (for `npm publish`)

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, asset: stepcheck-linux-x64 }
          # Intel-Mac binary is cross-compiled on the Apple-Silicon runner: the
          # scarce macos-13 (Intel) runner queues for a long time, whereas
          # macos-14 targets x86_64-apple-darwin fine and is readily available.
          - { os: macos-14,       target: x86_64-apple-darwin,      asset: stepcheck-darwin-x64 }
          - { os: macos-14,       target: aarch64-apple-darwin,     asset: stepcheck-darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   asset: stepcheck-win32-x64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: stepcheck
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        run: cp stepcheck/target/${{ matrix.target }}/release/stepcheck "${{ matrix.asset }}"
      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp stepcheck/target/${{ matrix.target }}/release/stepcheck.exe "${{ matrix.asset }}"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  publish-crate:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish (skips without token)
        working-directory: stepcheck
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."
            exit 0
          fi
          cargo publish --locked

  publish-npm:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: npm publish (skips without token)
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN not set; skipping npm publish."
            exit 0
          fi
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm publish --access public
