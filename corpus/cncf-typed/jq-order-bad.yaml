document:
  dsl: '1.0.0'
  namespace: examples
  name: jq-order-bad
do:
  - reserveInventory:
      call: http
      input:
        schema:
          document:
            properties:
              orderId: { type: string }
              amount: { type: number }
              items: { type: array }
      with:
        order: ${ .orderId }
        customer: ${ .customer.id }
